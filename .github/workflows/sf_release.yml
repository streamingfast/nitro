name: Docker build CI (StreamingFast version)
run-name: Docker build CI triggered from @${{ github.actor }} of ${{ github.head_ref }}

on:
  workflow_dispatch:
    inputs:
      firehose_ethereum_image:
        description: "Firehose Ethereum Docker image"
        required: false
        default: "ghcr.io/streamingfast/firehose-ethereum:latest"
  push:
    tags:
      - "*"
    branches:
      - release/*

env:
  REGISTRY: ghcr.io
  FIREHOSE_ETHEREUM_IMAGE: ${{ inputs.firehose_ethereum_image || 'ghcr.io/streamingfast/firehose-ethereum:latest' }}

jobs:
  prepare:
    name: Resolve versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.extract-versions.outputs.VERSION }}
      fireeth_docker_suffix: ${{ steps.extract-versions.outputs.FIREETH_DOCKER_SUFFIX }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - name: Lowercase image name
        id: image
        # Container registries require lowercase repository names; github.repository
        # preserves the org's original casing, so normalize it here.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract versions
        id: extract-versions
        run: |
          version="edge-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
          fi

          docker pull "${{ env.FIREHOSE_ETHEREUM_IMAGE }}"
          fireeth_version=$(docker inspect "${{ env.FIREHOSE_ETHEREUM_IMAGE }}" --format='{{index .Config.Labels "org.opencontainers.image.version"}}')

          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "FIREETH_VERSION=${fireeth_version}" >> "$GITHUB_OUTPUT"
          echo "FIREETH_DOCKER_SUFFIX=${version}-fireeth-${fireeth_version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete files
        shell: bash
        run: |
          echo "Starting"
          df -h
          sudo du -sh /opt/hostedtoolcache
          sudo time rm -rf /opt/hostedtoolcache
          df -h
          echo "Ending"

          # September 19th, 2025, this is still required to get enough space to build
          df -h
          sudo rm -rf /usr/local/lib/android/sdk/ndk* &  # NDK is 6.2G
          sudo rm -rf /opt/hostedtoolcache &  # 1 GiB in 15s

          cd /opt
          find . -maxdepth 1 -mindepth 1 '!' -path ./containerd '!' -path ./actionarchivecache '!' -path ./runner '!' -path ./runner-cache -exec rm -rf {} + &

          wait  # Wait for background deletions to complete
          df -h

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate docker labels from github build context
        id: meta-bare
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}

      - name: Build nitro Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nitro-node
          file: ./Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}-base:${{ needs.prepare.outputs.version }}
          labels: ${{ steps.meta-bare.outputs.labels }}

      - name: Build and push final (fireeth + nitro) per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sf
          push: true
          build-args: |
            NITRO_BASE_IMAGE=${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}-base:${{ needs.prepare.outputs.version }}
            FIREHOSE_ETHEREUM_IMAGE=${{ env.FIREHOSE_ETHEREUM_IMAGE }}
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta-bare.outputs.labels }}

  manifest:
    name: Create multi-arch manifests
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate docker tags from github build context
        id: meta-bare
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.version }},suffix=${{ needs.prepare.outputs.fireeth_docker_suffix }}
            type=raw,enable=${{ github.ref == 'refs/heads/develop' }},value=develop

      - name: Create and push manifests
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAGS: ${{ steps.meta-bare.outputs.tags }}
        run: |
          src_prefix="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" \
              "${src_prefix}-amd64" "${src_prefix}-arm64"
          done <<< "$TAGS"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binaries
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            src="${REGISTRY}/${IMAGE_NAME}:${VERSION}-${arch}"
            docker cp "$(docker create "$src"):/usr/local/bin/nitro" "./nitro_linux_${arch}"
          done

      - name: Extract Changelog
        id: changelog
        run: |
          curl -L https://github.com/streamingfast/sfreleaser/releases/download/v0.12.1/sfreleaser_linux_x86_64.tar.gz | tar -xz
          chmod +x sfreleaser

          ./sfreleaser changelog extract-section \
            github://token:${{ github.token }}@${{ github.repository }}/$GITHUB_SHA/CHANGELOG.sf.md \
            --github-output="changelog:$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            ./nitro_linux_amd64
            ./nitro_linux_arm64
